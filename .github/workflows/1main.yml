name: Build Vortex Launcher

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fix Java filename if needed
        shell: bash
        run: |
          if [ ! -f VortexLauncher.java ] && [ -f VortexLauncher__2_.java ]; then
            mv VortexLauncher__2_.java VortexLauncher.java
          fi
          ls -la

      - name: Compile launcher
        shell: bash
        run: |
          mkdir -p build/classes build/input dist
          javac -encoding UTF-8 -Xlint:none -d build/classes VortexLauncher.java
          printf 'Main-Class: VortexLauncher\n' > build/manifest.txt
          jar cfm build/input/VortexLauncher.jar build/manifest.txt -C build/classes .
          cp vortex-logo.png build/input/
          cp vortex-client-*.jar build/input/

      - name: Make icon
        shell: bash
        run: |
          python -m pip install pillow
          python -c "from PIL import Image; Image.open('vortex-logo.png').convert('RGBA').save('build/vortex.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Package Windows exe (bundled Java)
        shell: bash
        run: jpackage --type app-image --name VortexLauncher --input build/input --main-jar VortexLauncher.jar --main-class VortexLauncher --icon build/vortex.ico --dest dist

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/VortexLauncher -DestinationPath VortexLauncher-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: VortexLauncher-windows
          path: VortexLauncher-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: VortexLauncher-jar
          path: build/input/VortexLauncher.jar

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VortexLauncher-windows.zip
            build/input/VortexLauncher.jar
